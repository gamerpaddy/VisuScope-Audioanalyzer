name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "VisuScope-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/visuscope.exe, README.md, LICENSE $name
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: visuscope-windows
          path: VisuScope-*.zip
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # the description of a release is release-notes/<tag>.md; without one the release at least names its version
          $f = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $f)) { Set-Content -Path $f -Value "VisuScope ${{ github.ref_name }}" }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VisuScope-*.zip
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
